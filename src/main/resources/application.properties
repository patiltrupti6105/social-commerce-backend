spring.application.name=social-commerce

# ─── MySQL ───────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/socialcommerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA ─────────────────────────────────────────────────────────────────────
# validate: Flyway owns the schema; Hibernate only checks entities match it.
# Set to 'none' in prod if you want to skip the startup check entirely.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ─── Flyway ──────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# On first boot against an existing DB (with tables but no flyway_schema_history),
# set FLYWAY_BASELINE=true once to adopt it, then remove the override.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE:false}

# ─── MongoDB ─────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/socialcommerce}

# ─── JWT ─────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:SocialCommerceSecretKeyThatIsAtLeast32CharactersLong}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── CORS ────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# ─── Public base URL ─────────────────────────────────────────────────────────
app.base-url=${BASE_URL:http://localhost:8080}

# ─── File upload ─────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Storage mode: 'local' (default) or 's3'
app.storage.mode=${STORAGE_MODE:local}

# Local storage directory (only used when STORAGE_MODE=local)
app.upload.dir=${UPLOAD_DIR:uploads}

# ─── AWS S3 (only needed when STORAGE_MODE=s3) ───────────────────────────────
aws.s3.bucket-name=${AWS_S3_BUCKET:}
aws.s3.region=${AWS_S3_REGION:us-east-1}
# Credentials come from the environment (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
# or an IAM instance role — never hardcoded here.

# ─── Pagination defaults ─────────────────────────────────────────────────────
app.pagination.default-page-size=${DEFAULT_PAGE_SIZE:20}
app.pagination.notification-page-size=${NOTIFICATION_PAGE_SIZE:30}

# ─── Jackson ─────────────────────────────────────────────────────────────────
# Serialize LocalDate/LocalDateTime as ISO-8601 strings ("2024-09-25T14:30:00")
# instead of arrays ([2024,9,25,14,30,0]) so the frontend can parse them.
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ─── SpringDoc OpenAPI (Swagger UI) ──────────────────────────────────────────
# Swagger UI accessible at: http://localhost:8080/swagger-ui.html
# API docs JSON at: http://localhost:8080/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
# Show full request/response examples
springdoc.swagger-ui.displayRequestDuration=true
