# ─────────────────────────────────────────────────────────────
# Railway config — Spring Boot Backend
#
# Railway reads this file automatically when you deploy this
# folder as a service. It tells Railway how to build the image
# and how to health-check the running container.
#
# Docs: https://docs.railway.app/reference/config-as-code
# ─────────────────────────────────────────────────────────────

[build]
# Use the Dockerfile in this directory
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects $PORT at runtime — Spring Boot reads it via
# the PORT env var defined in application.properties.
startCommand = "java -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom -jar app.jar"

# How long to wait for the container to start before marking
# the deploy as failed (seconds).
startupProbe = { type = "http", path = "/actuator/health", timeoutSeconds = 120 }

# Health check — Railway will restart the container if this fails.
healthcheckPath = "/actuator/health"
healthcheckTimeout = 30

# Number of previous deploys to keep (for instant rollback).
numReplicas = 1

# Restart policy: restart on crash, but not on intentional stop.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
